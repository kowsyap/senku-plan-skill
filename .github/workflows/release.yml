name: Release

# Tag a version (git tag v1.1.0 && git push --tags) and this checks the skill,
# zips it the way Claude expects (senku-plan/SKILL.md inside) and attaches it
# to a release, so the latest download link always gives the newest skill.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the examples still pass
        run: |
          python3 senku-plan/scripts/senku_plan.py validate senku-plan/examples/ppl-plan.senku.json
          python3 senku-plan/scripts/senku_plan.py validate senku-plan/examples/made-upper-lower.senku.json

      - name: Zip the skill
        run: zip -r senku-plan.zip senku-plan -x '*.DS_Store' '*__pycache__*'

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" senku-plan.zip --title "$GITHUB_REF_NAME" --generate-notes
